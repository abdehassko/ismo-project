version: "3.8"

services:
  backend:
    build: ./back-end
    container_name: ismo-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://root:123456@mongo:27017/ismo-project-db?authSource=admin
      - PORT=5000
      - JWT_SECRET=ismopass
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - mongo
    volumes:
      - ./back-end/uploads:/app/uploads

  frontend:
    build: ./front-end
    container_name: ismo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:6
    container_name: ismo-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=123456
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:alpine
    container_name: ismo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data: